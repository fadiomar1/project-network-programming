name: router-lab

topology:
  nodes:
    pc1:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.2/24 dev eth1
        - ip route replace 192.168.20.0/24 via 192.168.10.1

    r1:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 192.168.10.1/24 dev eth1
        - ip addr add 192.168.20.1/24 dev eth2

    pc2:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.20.2/24 dev eth1
        - ip route replace 192.168.10.0/24 via 192.168.20.1

  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "pc2:eth1"]
